name: Update star history

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/update-star-history.yml

permissions:
  contents: read

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate star history
        uses: leereilly/star-chart@v0.3
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          output: assets/star-history.svg
          style: step-line
          dual_theme: true

      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/star-history-light.svg assets/star-history-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update star history'
            git push
          fi
