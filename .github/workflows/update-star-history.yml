name: Update star history

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/update-star-history.yml
      - .github/scripts/render_star_history.py

permissions:
  contents: read

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate star history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/render_star_history.py

      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/star-history-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update star history'
            git push
          fi
